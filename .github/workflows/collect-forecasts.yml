   name: Collect forecasts

   on:
     schedule:
       - cron: "5 */6 * * *"   # at minute 5 of every 6th hour, UTC
     workflow_dispatch:         # lets you start it by hand from the Actions tab

   jobs:
     call-api:
       runs-on: ubuntu-latest
       steps:
         - name: Request a forecast for each utility
           run: |
            status=0
            for u in AZPS SRP; do
              curl --silent --show-error --fail-with-body --max-time 120 --retry 2 \
                "${{ secrets.FORECAST_URL }}/forecast?utility=$u" -o "response_$u.json" \
                || { echo "FAILED for $u:"; cat "response_$u.json"; echo; status=1; }
            done
            exit $status