name: Forecast health check

on:
  schedule:
    - cron: "30 15 * * 1"   # Mondays at 15:30 UTC, which is 8:30 AM in Phoenix
  workflow_dispatch:         # lets you start it by hand from the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt
      - name: Check recent forecast accuracy
        run: python -m src.monitoring.run_health_check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}