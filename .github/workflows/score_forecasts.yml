name: Score forecasts

on:
  schedule:
    - cron: "20 8 * * *"   # 08:20 UTC every day, which is 1:20 AM in Phoenix (off the busy top of the hour)
  workflow_dispatch:        # lets you start it by hand from the Actions tab

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt
      - name: Grade mature forecasts and save the scores
        run: python -m src.models.run_live_scoring --save
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}