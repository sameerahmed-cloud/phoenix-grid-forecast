name: Refresh training data

on:
  schedule:
    - cron: "0 10 * * 0"   # Sundays at 10:00 UTC, which is 3:00 AM in Phoenix
  workflow_dispatch:        # lets you start it by hand from the Actions tab

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt
      - name: Add the newest weeks to the training table
        run: python -m src.retraining.refresh_training_data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}